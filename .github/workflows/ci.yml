name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OpportunityPilot.sln
      - run: dotnet build OpportunityPilot.sln --configuration Release --no-restore
      - run: dotnet test OpportunityPilot.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: coverage/**/coverage.cobertura.xml
      # Floors for the business layers (tools/coverage-gate.py); raise them as tests are added, never lower them.
      - name: Coverage floors
        run: python3 tools/coverage-gate.py coverage
      # docs/api-endpoints.md is generated from the controllers; a new or changed endpoint must regenerate it.
      - name: Endpoint index is up to date
        run: python3 tools/endpoints.py --check
      - name: No known vulnerable packages
        run: |
          dotnet list OpportunityPilot.sln package --vulnerable --include-transitive | tee vuln.txt
          ! grep -qE "\b(High|Critical)\b" vuln.txt
      # The EF model and the migrations must match for both providers, or a deploy would migrate the wrong schema.
      # The repo pins dotnet-ef in .config/dotnet-tools.json; restore that exact version (a newer global install is ignored).
      - run: dotnet tool restore
      - name: Migrations match the model (SqlServer, Postgres)
        run: |
          for c in SqlServer Postgres; do
            dotnet ef migrations has-pending-model-changes -p src/OpportunityPilot.Infrastructure -s src/OpportunityPilot.Api               --context ${c}AppDbContext --configuration Release --no-build
          done
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      # The end-to-end test drives a real headless Chromium; the runner does not ship Playwright's build.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  # Claude Code setup (2026-10-26): MCP servers only from the policy table, deny rules and hooks in place, and the guard hooks tested.
  ai-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .claude/check-ai-config.mjs
      - run: node --test .claude/hooks/hooks.test.mjs

  # Every PR keeps the template's sections, so what changed, what was checked and how to roll back are always written down.
  pr-template:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR description follows the template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=""
          for section in "## What and why" "## Checked" "## Risk and rollback"; do
            printf '%s' "$BODY" | grep -qF "$section" || missing="$missing [$section]"
          done
          if [ -n "$missing" ]; then echo "The PR description is missing:$missing (see .github/pull_request_template.md)"; exit 1; fi
          echo "PR description has every template section."
